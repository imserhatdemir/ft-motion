<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Animation studio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=block">
<link rel="stylesheet" href="../node_modules/@fontsource/barlow-condensed/800.css">
<style>
  html, body { margin: 0; background: #1b1820; color: #eee; font: 13px system-ui, sans-serif; }
  main { padding: 12px; display: grid; gap: 8px; }
  #out { width: min(100%, 1280px); aspect-ratio: 16 / 9; height: auto; background: #F3EBDC; }
  .p5Canvas { display: none !important; }
  .bar { display: flex; gap: 10px; align-items: center; max-width: 1280px; }
  #scrub { flex: 1; }
  #tt { font-variant-numeric: tabular-nums; min-width: 190px; }
</style>
<script src="../node_modules/p5/lib/p5.min.js"></script>
<script src="../node_modules/p5.brush/dist/p5.brush.js"></script>
</head>
<body>
<main>
  <canvas id="out" width="1920" height="1080"></canvas>
  <div class="bar"><input id="scrub" type="range" min="0" max="30" step="0.0417" value="0"><span id="tt">loading…</span></div>
</main>
<!-- pick the video: studio.html?scene=earthquake (default) or ?scene=river. Each has src/scenes/<name>.config.js (PROJECT: length, tempo, size). -->
<script>
  const SCENE = new URLSearchParams(location.search).get('scene') || 'earthquake';
  const SCRIPTS = { earthquake: ['earthquake_schedule', 'earthquake'], river: ['cat', 'river_schedule', 'river'] };
  const load = src => document.write('<script src="' + src + '"><\/script>');
  load('src/scenes/' + SCENE + '.config.js');
</script>
<script>
  { const o = document.getElementById('out'), w = PROJECT.width || 1920, h = PROJECT.height || 1080;
    o.width = w; o.height = h; o.style.aspectRatio = w + ' / ' + h; o.style.width = 'min(100%, ' + (w >= h ? 1280 : 480) + 'px)';
    document.getElementById('scrub').max = PROJECT.duration; }
</script>
<!-- engine -->
<script src="src/core.js"></script>
<script src="src/clawd.js"></script>
<script src="src/timeline.js"></script>
<!-- reference sheets (standalone loops) -->
<script src="src/sheets.js"></script>
<!-- your video: the scripts of the chosen scene, in order -->
<script>SCRIPTS[SCENE].forEach(n => load('src/scenes/' + n + '.js'));</script>
<script>
  // Open studio.html?loop=emotions (or views, cat) to scrub a standalone loop instead of the video.
  const q = new URLSearchParams(location.search).get('loop'); if (q && LOOPS[q]) window.LOOP = LOOPS[q];
</script>
</body>
</html>
